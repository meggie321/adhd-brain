<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ADHD 脑力训练站</title>
<style>
:root{--bg:#fdf6e3;--card:#fff;--mint:#2a9d8f;--coral:#e76f51;--ink:#2b2b2b;--muted:#6c757d;--line:#eadfca;--shadow:0 12px 30px rgba(43,43,43,.08)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;min-height:100vh}button,input{font:inherit}button{border:0;cursor:pointer}.hidden{display:none!important}.app{max-width:1050px;margin:0 auto;padding:24px}.screen{min-height:calc(100vh - 48px);display:flex;align-items:center;justify-content:center}.panel{width:min(100%,520px);background:var(--card);border-radius:28px;padding:32px;box-shadow:var(--shadow)}h1{font-size:clamp(2rem,6vw,3.4rem);line-height:1.1;margin:0 0 18px}h2{font-size:1.8rem;margin:0 0 14px}h3{margin:0;font-size:1.2rem}.sub{color:var(--muted);line-height:1.6}.field{margin:16px 0}.field label{display:block;font-weight:700;margin-bottom:8px}.field input{width:100%;height:64px;border:2px solid var(--line);border-radius:18px;padding:0 18px;background:#fff;font-size:1.15rem}.field input:focus{outline:3px solid rgba(42,157,143,.2);border-color:var(--mint)}.password-row{display:flex;gap:8px}.password-row input{flex:1}.tiny-btn{height:64px;padding:0 14px;border-radius:16px;background:#f2ead8;color:var(--ink)}.primary,.secondary,.danger{min-height:64px;border-radius:18px;padding:0 22px;font-weight:800;font-size:1.1rem}.primary{background:var(--mint);color:#fff}.secondary{background:#f2ead8;color:var(--ink)}.danger{background:#ffe3dc;color:#9d3c24}.wide{width:100%}.error{color:#b42318;font-size:1.1rem;font-weight:800;min-height:28px;margin-top:12px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:24px}.brand{font-weight:900;font-size:1.4rem}.top-actions{display:flex;gap:8px}.pill{background:#fff;border:1px solid var(--line);padding:10px 14px;border-radius:999px}.hero{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:20px}.hero p{margin:4px 0;color:var(--muted)}.profile{display:flex;gap:10px;flex-wrap:wrap}.profile span{background:#fff;padding:10px 14px;border-radius:14px;font-weight:700}.analysis{background:#e7f5f2;border:2px solid #c9e9e4;border-radius:22px;padding:20px;margin:18px 0}.analysis-title{font-weight:900;color:#1e746a;margin-bottom:10px}.analysis-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.analysis-item{background:#fff;border-radius:16px;padding:12px;font-size:.95rem;line-height:1.5}.analysis-item b{display:block;color:var(--mint);margin-bottom:4px}.training-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.train-card{background:#fff;border-radius:22px;padding:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px;min-height:210px}.emoji{font-size:2.4rem}.train-card p{color:var(--muted);margin:0;line-height:1.5;flex:1}.switch{display:flex;align-items:center;gap:10px}.switch input{width:22px;height:22px;accent-color:var(--mint)}.modal-backdrop{position:fixed;inset:0;background:rgba(43,43,43,.38);display:flex;align-items:center;justify-content:center;padding:18px;z-index:5}.modal{background:#fff;border-radius:28px;padding:28px;width:min(100%,520px);max-height:92vh;overflow:auto}.modal-actions{display:flex;gap:10px;margin-top:18px}.modal-actions>*{flex:1}.training-view{position:fixed;inset:0;background:var(--bg);z-index:4;padding:22px;overflow:auto}.game-shell{max-width:700px;margin:0 auto}.game-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.game-area{background:#fff;border-radius:26px;min-height:430px;padding:24px;position:relative;box-shadow:var(--shadow)}.game-center{text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:380px;gap:16px}.feedback{font-weight:800;min-height:28px;color:var(--mint)}.target{position:absolute;width:58px;height:58px;border-radius:50%;background:var(--coral);box-shadow:0 5px 0 #bb533a;animation:pop .18s ease-out}.memory-seq{font-size:3rem;letter-spacing:10px}.memory-choices{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.choice{font-size:2rem;min-width:64px;min-height:64px;border-radius:18px;background:#f2ead8}.logic-shape{font-size:3rem;letter-spacing:12px}.minimal{position:fixed;inset:0;background:#fff;z-index:10;display:flex;align-items:center;justify-content:center;padding:24px}.minimal-inner{width:min(100%,640px);text-align:center}.minimal-step{font-size:clamp(2rem,7vw,4rem);font-weight:900;line-height:1.2;margin:40px 0}.minimal-nav{display:flex;gap:12px}.minimal-nav button{flex:1}.dots{color:var(--mint);font-size:1.6rem;letter-spacing:7px}@keyframes pop{from{transform:scale(.3)}to{transform:scale(1)}}@media(max-width:760px){.app{padding:14px}.screen{min-height:calc(100vh - 28px)}.panel{padding:24px}.hero{display:block}.topbar{align-items:flex-start}.training-grid{grid-template-columns:1fr}.analysis-grid{grid-template-columns:1fr}.modal-actions{flex-direction:column}.game-area{min-height:calc(100vh - 150px)}}
</style></head>
<body><main class="app">
<section id="loginScreen" class="screen"><div class="panel"><h1>ADHD<br>脑力训练站</h1><p class="sub">给大脑一点轻松、短小的练习。</p><form id="loginForm"><div class="field"><label for="username">用户名</label><input id="username" required autocomplete="username" placeholder="输入你的名字"></div><div class="field"><label for="password">通行密码</label><div class="password-row"><input id="password" required type="password" autocomplete="current-password" placeholder="输入密码"><button type="button" class="tiny-btn" id="togglePassword">显示</button></div></div><button class="primary wide" type="button" id="loginBtn">进入训练站</button><div id="loginError" class="error"></div></form><p class="sub" style="font-size:.9rem">没有账号？输入新用户名和密码，自动创建。</p></div></section>
<section id="homeScreen" class="hidden"><div class="topbar"><div class="brand">🧠 ADHD 脑力训练站</div><div class="top-actions"><button class="pill" id="settingsBtn">设置</button><button class="pill" id="logoutBtn">退出</button></div></div><div class="hero"><div><h2>欢迎，<span id="welcomeName"></span></h2><p>今天做一个小练习，就很好。</p></div><label class="switch"><input id="minimalToggle" type="checkbox"> 极简模式</label></div><div class="profile"><span>游戏时间：<b id="gameTimeValue">0 秒</b></span><span>年龄：<b id="ageValue">未填写</b></span><span>韦氏分数：<b id="waisValue">未填写</b></span><button class="pill" id="editProfileBtn">修改年龄 / 分数</button></div><div id="analysisBox" class="analysis"></div><div class="training-grid"><article class="train-card"><div class="emoji">🎯</div><h3>专注力训练</h3><p>30 秒内点中出现的圆圈。</p><button class="primary" data-game="focus">开始</button></article><article class="train-card"><div class="emoji">🧩</div><h3>记忆力训练</h3><p>记住 emoji 的顺序，再点回来。</p><button class="primary" data-game="memory">开始</button></article><article class="train-card"><div class="emoji">🔷</div><h3>逻辑训练</h3><p>找出图形规律，完成 5 题。</p><button class="primary" data-game="logic">开始</button></article></div></section>
</main>
<div id="profileModal" class="modal-backdrop hidden"><div class="modal"><h2>先认识一下你的大脑</h2><p class="sub">填好两项，就能得到更合适的建议。</p><form id="profileForm"><div class="field"><label for="age">你的年龄是多少？</label><input id="age" type="number" min="3" max="120" placeholder="14" required></div><div class="field"><label for="wais">你的韦氏智力分数是多少？</label><p class="sub" style="font-size:.9rem">比如 100 是平均，120 是优秀。</p><input id="wais" type="number" min="40" max="180" placeholder="105" required></div><div class="modal-actions"><button class="primary" type="submit">保存并分析</button><button class="secondary" type="button" id="skipProfile">跳过</button></div></form></div></div>
<div id="settingsModal" class="modal-backdrop hidden"><div class="modal"><h2>设置</h2><p class="sub">DeepSeek Key 只保存在这台设备上。</p><div class="field"><label for="apiKey">DeepSeek API Key（可选）</label><input id="apiKey" type="password" placeholder="sk-..."></div><div class="modal-actions"><button class="primary" id="saveSettings">保存</button><button class="secondary" id="closeSettings">关闭</button></div></div></div>
<div id="trainingView" class="training-view hidden"><div class="game-shell"><div class="game-head"><h2 id="gameTitle"></h2><button class="secondary" id="closeGame">退出训练</button></div><div id="gameArea" class="game-area"></div></div></div>
<div id="minimalView" class="minimal hidden"><div class="minimal-inner"><div class="dots" id="minimalDots"></div><div class="minimal-step" id="minimalStep"></div><div class="minimal-nav"><button class="secondary" id="minimalPrev">上一个</button><button class="primary" id="minimalNext">下一个</button></div><button class="pill" id="closeMinimal" style="margin-top:18px">关闭极简模式</button></div></div>
<script>
const $=s=>document.querySelector(s);const usersKey='adhd_users';const sessionKey='adhd_session';let currentUser=null;let focusTimer=null;
const getUsers=()=>JSON.parse(localStorage.getItem(usersKey)||'{}');const saveUsers=u=>localStorage.setItem(usersKey,JSON.stringify(u));
function beep(freq=520,dur=.08){try{const c=new AudioContext(),o=c.createOscillator(),g=c.createGain();o.frequency.value=freq;o.connect(g);g.connect(c.destination);g.gain.value=.04;o.start();o.stop(c.currentTime+dur)}catch(e){}}
function localAnalysis(age,wais){const group=age<13?'小朋友':age<18?'青少年':'成年人';const level=wais>=120?'表现优秀':wais>=90?'处于平均范围':'可以用自己的节奏进步';return {summary:`${group}的你，${level}，每个人的优势都不同。`,focus:`每天 5 分钟，短时专注`,memory:`每天 5-10 分钟，重复记忆`,logic:`每天 5-15 分钟，慢慢推理`,time:'建议每天 5-15 分钟'} }
async function getAnalysis(age,wais){const key=localStorage.getItem('adhd_deepseek_key');if(!key)return localAnalysis(age,wais);try{const r=await fetch('https://api.deepseek.com/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify({model:'deepseek-chat',messages:[{role:'user',content:`用户年龄是 ${age} 岁，韦氏智商分数是 ${wais}。用 ADHD 友好的方式，给出：1.一句话说明这个年龄 + 这个分数意味着什么（不贴标签）2.三个训练重点（专注力 / 记忆力 / 逻辑）3.每天建议训练时长（5-15 分钟）。每句不超过 20 字，不要术语，不要吓人。要考虑年龄因素。请严格返回 JSON，字段 summary,focus,memory,logic,time。`}],temperature:.4})});const j=await r.json();return JSON.parse(j.choices[0].message.content.replace(/```json|```/g,'').trim())}catch(e){return localAnalysis(age,wais)}}
function render(){const a=currentUser?.age,w=currentUser?.wais;$('#welcomeName').textContent=currentUser?.name||'';$('#ageValue').textContent=a||'未填写';$('#waisValue').textContent=w||'未填写';const an=currentUser?.analysis||localAnalysis(a||14,w||105);$('#analysisBox').innerHTML=`<div class="analysis-title">✨ 给你的建议</div><div style="margin-bottom:12px">${an.summary||''}</div><div class="analysis-grid"><div class="analysis-item"><b>🎯 专注力</b>${an.focus||''}</div><div class="analysis-item"><b>🧩 记忆力</b>${an.memory||''}</div><div class="analysis-item"><b>🔷 逻辑</b>${an.logic||''}</div></div><div style="margin-top:12px;font-weight:700">⏱ ${an.time||'建议每天 5-15 分钟'}</div>`}
function showHome(){ $('#loginScreen').classList.add('hidden');$('#homeScreen').classList.remove('hidden');render();if(!currentUser.age||!currentUser.wais)$('#profileModal').classList.remove('hidden')}
$('#loginForm').addEventListener('submit',e=>{e.preventDefault();const name=$('#username').value.trim(),pass=$('#password').value;const u=getUsers();if(u[name]&&u[name].password!==pass){$('#loginError').textContent='通行密码不对';return}if(!u[name])u[name]={password:pass,name};currentUser={...u[name],name};u[name]=currentUser;saveUsers(u);localStorage.setItem(sessionKey,name);$('#loginError').textContent='';showHome()});$('#togglePassword').onclick=()=>{const i=$('#password');i.type=i.type==='password'?'text':'password';$('#togglePassword').textContent=i.type==='password'?'显示':'隐藏'};
$('#profileForm').addEventListener('submit',async e=>{e.preventDefault();const age=+$('#age').value,wais=+$('#wais').value;currentUser.age=age;currentUser.wais=wais;$('#profileModal').classList.add('hidden');$('#analysisBox').innerHTML='<div class="analysis-title">✨ 正在准备建议…</div>';currentUser.analysis=await getAnalysis(age,wais);const u=getUsers();u[currentUser.name]=currentUser;saveUsers(u);render()});$('#skipProfile').onclick=()=>{$('#profileModal').classList.add('hidden');currentUser.age='未填写';currentUser.wais='未填写';const u=getUsers();u[currentUser.name]=currentUser;saveUsers(u);render()};
$('#logoutBtn').onclick=()=>{localStorage.removeItem(sessionKey);currentUser=null;$('#homeScreen').classList.add('hidden');$('#loginScreen').classList.remove('hidden');$('#loginForm').reset()};$('#settingsBtn').onclick=()=>{$('#apiKey').value=localStorage.getItem('adhd_deepseek_key')||'';$('#settingsModal').classList.remove('hidden')};$('#closeSettings').onclick=()=>$('#settingsModal').classList.add('hidden');$('#saveSettings').onclick=()=>{localStorage.setItem('adhd_deepseek_key',$('#apiKey').value.trim());$('#settingsModal').classList.add('hidden')};
const minimalSteps=['现在只做一件事：喝一口水。','现在只做一件事：深呼吸 3 次。','现在只做一件事：写下下一步要做的事。','完成。'];let minIndex=0;function openMinimal(){minIndex=0;$('#minimalView').classList.remove('hidden');updateMinimal()}function updateMinimal(){$('#minimalStep').textContent=minimalSteps[minIndex];$('#minimalDots').textContent=minimalSteps.map((_,i)=>i===minIndex?'●':'○').join(' ');$('#minimalPrev').disabled=minIndex===0;$('#minimalNext').textContent=minIndex===minimalSteps.length-1?'再来一次':'下一个'}$('#minimalToggle').onchange=e=>e.target.checked?openMinimal():$('#minimalView').classList.add('hidden');$('#closeMinimal').onclick=()=>{$('#minimalView').classList.add('hidden');$('#minimalToggle').checked=false};$('#minimalPrev').onclick=()=>{if(minIndex>0){minIndex--;updateMinimal()}};$('#minimalNext').onclick=()=>{if(minIndex<minimalSteps.length-1){minIndex++;updateMinimal()}else{minIndex=0;updateMinimal()}};
function openGame(type){$('#trainingView').classList.remove('hidden');$('#gameTitle').textContent={focus:'🎯 专注力训练',memory:'🧩 记忆力训练',logic:'🔷 逻辑训练'}[type];({focus:startFocus,memory:startMemory,logic:startLogic}[type])()}$('#closeGame').onclick=()=>{$('#trainingView').classList.add('hidden');clearInterval(focusTimer)};document.querySelectorAll('[data-game]').forEach(b=>b.onclick=()=>openGame(b.dataset.game));
function startFocus(){let hits=0,total=0,start=0,sumReaction=0,ended=false;const area=$('#gameArea');area.innerHTML='<div class="game-center"><div style="position:absolute;left:20px;top:16px;font-weight:900;color:var(--coral)"><span id="timerBadge">剩余时间：30 秒</span><span id="durationBadge" style="margin-left:16px;color:var(--mint)">游戏时长：0 秒</span></div><p>30 秒内，尽量点中圆圈。</p><div class="feedback" id="fb">准备好了吗？</div></div>';function spawn(){if(ended)return;const t=document.createElement('button');t.className='target';t.style.left=(8+Math.random()*78)+'%';t.style.top=(18+Math.random()*65)+'%';start=performance.now();total++;t.onclick=()=>{hits++;beep();$('#fb').textContent='点中了！';t.remove();spawn()};area.appendChild(t)}spawn();let left=30;focusTimer=setInterval(()=>{left--;$('#timerBadge').textContent='剩余时间：'+left+' 秒';$('#durationBadge').textContent='游戏时长：'+Math.floor((30-left)/4)+' 秒';$('#fb').textContent=`还剩 ${left} 秒 · 命中 ${hits}/${total}`;if(left<=0){ended=true;clearInterval(focusTimer);area.innerHTML=`<div class="game-center"><h2>完成！</h2><p>命中率：${total?Math.round(hits/total*100):0}%</p><button class="primary" id="again">再来一局</button></div>`;$('#again').onclick=startFocus}},1000)}
function startMemory(){const emojis=['🍎','🚀','🐶','🌈','🎈','🍀','⭐'];const seq=[...emojis].sort(()=>Math.random()-.5).slice(0,3+Math.floor(Math.random()*3));const area=$('#gameArea');area.innerHTML='<div class="game-center"><div class="memory-seq" id="seq">'+seq.join(' ')+'</div><p>记住顺序，马上会消失。</p></div>';setTimeout(()=>{area.innerHTML='<div class="game-center"><h3>按顺序点出 emoji</h3><div class="memory-choices">'+emojis.map(x=>`<button class="choice" data-e="${x}">${x}</button>`).join('')+'</div><div class="feedback" id="fb"></div></div>';let i=0;document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{if(b.dataset.e===seq[i]){b.disabled=true;i++;beep();if(i===seq.length){$('#fb').textContent='全部正确！';setTimeout(startMemory,1000)}}else{$('#fb').textContent='再想一下顺序';beep(220)}})},2200)}
function startLogic(){const qs=[['🔴 🔵 🔴 🔵 ?',['🔴','🟢','🔵'],'🔴'],['▲ ■ ▲ ■ ?',['■','●','▲'],'▲'],['⭐ ⭐ 🌙 ⭐ ⭐ ?',['🌙','☀️','⭐'],'🌙'],['🟢 🟡 🔵 🟢 🟡 ?',['🔵','🟢','🔴'],'🔵'],['⬆️ ➡️ ⬇️ ?',['⬅️','⬆️','↗️'],'⬅️']];let n=0,score=0;const area=$('#gameArea');function q(){const [pattern,opts,ans]=qs[n];area.innerHTML=`<div class="game-center"><div class="logic-shape">${pattern}</div><h3>下一个是什么？</h3><div class="memory-choices">${opts.map(x=>`<button class="choice">${x}</button>`).join('')}</div><div class="feedback" id="fb">第 ${n+1} / 5 题</div></div>`;document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{if(b.textContent===ans){score++;beep();$('#fb').textContent='答对了！'}else $('#fb').textContent='没关系，继续下一题';document.querySelectorAll('.choice').forEach(x=>x.disabled=true);setTimeout(()=>{n++;n<5?q():area.innerHTML=`<div class="game-center"><h2>完成！</h2><p>正确率：${score*20}%</p><button class="primary" id="again">再来一局</button></div>`;$('#again')?.addEventListener('click',startLogic)},700)} )}q()}
const session=localStorage.getItem(sessionKey),users=getUsers();if(session&&users[session]){currentUser=users[session];$('#loginScreen').classList.add('hidden');$('#homeScreen').classList.remove('hidden');showHome()}
</script></body></html>
